<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>

    

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<style>
    /* ORDERS PAGE */

.orders-page{
    padding:30px;
    max-width:1200px;
    margin:auto;
}
.orders-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.order-search{
    width:300px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.orders-table{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.view-btn{
    background:#4f46e5;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}
.completed{
    background:#dcfce7;
    color:#166534;
    padding:5px 10px;
    border-radius:20px;
    font-size:14px;
}

.pending{
    background:#fef3c7;
    color:#92400e;
    padding:5px 10px;
    border-radius:20px;
    font-size:14px;
}
table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:15px;
    background:#f3f4f6;
}

td{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
}
body{
    background:#f5f7fb;
    font-family:Arial, Helvetica, sans-serif;
}
</style>
<body>

<div class="orders-page">

    <div class="orders-header">

        <h2>Orders Management</h2>

        <input type="text"
        placeholder="Search Orders..."
        class="order-search">

    </div>

    <div class="orders-table">

        <table>

            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr>

                    <td>#ORD001</td>

                    <td>Rohith</td>

                    <td>Wireless Mouse</td>

                    <td>₹1200</td>

                    <td>
                        <span class="completed">
                            Delivered
                        </span>
                    </td>

                    <td>
                        <button class="view-btn">
                            View
                        </button>
                    </td>

                </tr>

                <tr>

                    <td>#ORD002</td>

                    <td>Arun</td>

                    <td>Keyboard</td>

                    <td>₹2400</td>

                    <td>
                        <span class="pending">
                            Pending
                        </span>
                    </td>

                    <td>
                        <button class="view-btn">
                            View
                        </button>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
<script src="js/product.js"></script>
