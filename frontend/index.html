<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcartZ Login</title>
  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#001133;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.main-container{
    width:100%;
    text-align:center;
}

.logo{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
    color:#0066ff;
    font-style:italic;
}

.orange{
    color:orange;
}

.card{
    width:650px;
    margin:auto;
    background:rgba(255,255,255,0.2);
    border-radius:15px;
    padding:40px;
    background-image:url('background.png');
    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;

    width:100%;
    height:100%;

    background:rgb(255, 255, 255);

    top:0;
    left:0;
}

.form-box{
    width:350px;
    margin:auto;
    background:rgb(255, 255, 255);
    padding:25px;
    border-radius:20px;
    position:relative;
    z-index:2;
}

.form-box h2{
    margin-bottom:20px;
    color:#555;
}

.input-group{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.input-group label{
    width:140px;
    text-align:right;
    margin-right:10px;
    color:#333;
}

.input-group input{
    flex:1;
    padding:10px;
    border:1px solid #999;
    border-radius:8px;
}

.toggle-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

.toggle-buttons input{
    display:none;
}

.toggle-buttons label{
    padding:12px 30px;
    background:#dbeafe;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.toggle-buttons input:checked + label{
    background:#2563eb;
    color:white;
}

.active{
    background:#0066ff !important;
    color:white;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:15px;
    cursor:pointer;
    font-size:16px;
}

.bottom-text{
    margin-top:15px;
    font-size:14px;
}

.bottom-text a{
    color:#0066ff;
    text-decoration:none;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#0066ff;
    font-size:14px;
}

.forgot{
    display:block;
    text-align:right;
    margin-bottom:10px;
    color:#0066ff;
    text-decoration:none;
    font-size:13px;
}
</style>
</head>
<body>

<div class="main-container">

  <div class="logo">
    <span class="orange">A</span>cart<span class="orange">Z</span>
  </div>

  <div class="card">

    <div class="form-box">

      <h2>Sign in to your Account</h2>

      <form id="loginForm">
        <div class="input-group">
          <label>Email / Username:</label>
          <input id="email" type="text" placeholder="Enter your Email or Name" required>
        </div>

        <div class="input-group">
          <label>Password:</label>
          <input id="password" type="password" placeholder="Enter your Password" required>
        </div>

        <a href="forgot.html" class="forgot">Forgot Password?</a>

        <div class="toggle-buttons">
          <input type="radio" id="customer" name="role" value="customer" checked>
          <label for="customer">Customer</label>

          <input type="radio" id="vendor" name="role" value="vendor">
          <label for="vendor">Vendor</label>
        </div>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <p class="bottom-text">
        Don't have an account?
        <a href="register.html">Register</a>
      </p>

    </div>

  </div>

</div>

</body>
</html>
<script src="js/auth.js"></script>
