<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP & Password Change</title>
  <link rel="stylesheet" href="st.css">
  <style>
    .hidden {
      display: none !important;
    }
  </style>
  <style>/* style.css */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#001133;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.main-container{
    width:100%;
    text-align:center;
}

.logo{
    font-size:70px;
    font-weight:bold;
    margin-bottom:20px;
    color:#0066ff;
    font-style:italic;
}

.orange{
    color:orange;
}

.card{
    width:650px;
    margin:auto;
    background:rgba(255,255,255,0.2);
    border-radius:15px;
    padding:40px;
    background-image:url('background.png');
    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;

    width:100%;
    height:100%;

    background:rgb(255, 255, 255);

    top:0;
    left:0;
}

.form-box{
    width:350px;
    margin:auto;
    background:rgb(255, 255, 255);
    padding:25px;
    border-radius:20px;
    position:relative;
    z-index:2;
}

.form-box h2{
    margin-bottom:20px;
    color:#555;
}

.input-group{
    display:flex;
    align-items:center;
    margin-bottom:15px;
}

.input-group label{
    width:140px;
    text-align:right;
    margin-right:10px;
    color:#333;
}

.input-group input{
    flex:1;
    padding:10px;
    border:1px solid #999;
    border-radius:8px;
}

.toggle-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

.toggle-buttons input{
    display:none;
}

.toggle-buttons label{
    padding:12px 30px;
    background:#dbeafe;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.toggle-buttons input:checked + label{
    background:#2563eb;
    color:white;
}

.active{
    background:#0066ff !important;
    color:white;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:10px;
    margin-top:15px;
    cursor:pointer;
    font-size:16px;
}

.bottom-text{
    margin-top:15px;
    font-size:14px;
}

.bottom-text a{
    color:#0066ff;
    text-decoration:none;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#0066ff;
    font-size:14px;
}

.forgot{
    display:block;
    text-align:right;
    margin-bottom:10px;
    color:#0066ff;
    text-decoration:none;
    font-size:13px;
}
</style>

</head>
<body>

<div class="main-container">

  <div class="logo">
    <span class="orange">A</span>cart<span class="orange">Z</span>
  </div>

  <div class="card">

    <div class="form-box">

      <!-- OTP Form -->
      <form id="otpForm">
        <h2>OTP Page</h2>

        <div class="input-group">
          <label>Email :</label>
          <input id="email" type="email" placeholder="Enter your Email" required>
        </div>

        <div class="input-group">
          <label>Enter OTP :</label>
          <input id="code" type="text" placeholder="Enter OTP sent to Mail" required>
        </div>

        <button type="submit" class="login-btn">Verify OTP</button>

        <div class="links">
          <p>Don't Have an Account<a href="register.html">Register</a></p>
          <p>Have an Account<a href="index.html">Login</a></p>
        </div>
      </form>

      <!-- Password Change Form -->
      <form id="resetForm" class="hidden">
        <h2>Password Change</h2>
        <input id="resetEmail" type="hidden">

        <div class="input-group">
          <label for="newPassword">New Password:</label>
          <input id="newPassword" type="password" placeholder="Enter your New password" required>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm New password:</label>
          <input id="confirmPassword" type="password" placeholder="Re Enter Your New password" required>
        </div>

        <button type="submit" class="login-btn">Confirm Password</button>

        <div class="links">
          <p>Don't have an account?<a href="register.html">Register</a></p>
          <p>Have an account?<a href="index.html">Login</a></p>
        </div>

        <button type="button" class="login-btn" style="background:#6c757d; margin-top:10px;" onclick="showOTP()">Back to OTP</button>
      </form>

    </div>

  </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
