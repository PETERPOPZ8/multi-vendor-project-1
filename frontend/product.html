<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products</title>

  

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<style>
  /* PRODUCTS PAGE */

.products-page{
    margin-top:30px;
}

.products-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.add-product-btn{
    background:#4f46e5;
    color:white;

    border:none;

    padding:12px 18px;

    border-radius:10px;

    cursor:pointer;
}

.product-table-container{
    background:white;

    padding:20px;

    border-radius:16px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.product-table-container table{
    width:100%;
}

.product-table-container img{
    width:60px;
    border-radius:8px;
}

.edit-btn{
    background:#22c55e;
    color:white;

    border:none;

    padding:8px 12px;

    border-radius:8px;

    cursor:pointer;
}

.delete-btn{
    background:#ef4444;
    color:white;

    border:none;

    padding:8px 12px;

    border-radius:8px;

    cursor:pointer;
}
body{
    background:#f5f7fb;
    font-family:Arial, Helvetica, sans-serif;
    padding:30px;
}
table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:15px;
    background:#f3f4f6;
}

td{
    padding:15px;
    border-bottom:1px solid #e5e7eb;
}
  </style>

<body>

<div class="products-page">

  <div class="products-header">

      <h2>Products Management</h2>

      <button class="add-product-btn">
        <i class="fa-solid fa-plus"></i>
        Add Product
      </button>

  </div>

  <div class="product-table-container">

      <table>

          <thead>

              <tr>
                  <th>Image</th>
                  <th>Product Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Action</th>
              </tr>

          </thead>

          <tbody>

              <tr>

                  <td>
                    <img src="mouse.webp" alt="Wireless Mouse">
                  </td>

                  <td>Wireless Mouse</td>

                  <td>Electronics</td>

                  <td>₹1200</td>

                  <td>85</td>

                  <td>

                    <button class="edit-btn">
                      Edit
                    </button>

                    <button class="delete-btn">
                      Delete
                    </button>

                  </td>

              </tr>

              <tr>

                  <td>
                    <img src="keyboard.jpg" alt="Jlab Go Wireless Keyboard">
                  </td>

                  <td>Keyboard</td>

                  <td>Electronics</td>

                  <td>₹2400</td>

                  <td>30</td>

                  <td>

                    <button class="edit-btn">
                      Edit
                    </button>

                    <button class="delete-btn">
                      Delete
                    </button>

                  </td>

              </tr>
              <tr>
                <td>
                    <img src="smartwatch.jpg" alt="BOAT StormCall">
                </td>
                <td>BOAT StormCall</td>
                <td>Electronics</td>
                <td>₹1500</td>
                <td>50</td>
                <td>
                    <button class="edit-btn">
                      Edit
                    </button>
                    <button class="delete-btn">
                      Delete
                    </button>
                </td>
              </tr>
              <tr>
                <td>
                    <img src="buds.webp" alt="Oneplus NordBuds 3r Tws">
                </td>
                <td>Oneplus NordBuds 3r Tws</td>
                <td>Electronics</td>
                <td>₹2500</td>
                <td>25</td>
                <td>
                    <button class="edit-btn">
                      Edit
                    </button>
                    <button class="delete-btn">
                      Delete
                    </button>
                </td>
              </tr>

          </tbody>

      </table>

  </div>

</div>


</body>
</html>
<script src="js/product.js"></script>
